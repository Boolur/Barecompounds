name: Supabase

on:
  pull_request:
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/seed.sql"
      - "supabase/tests/**"
      - ".github/workflows/supabase.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/seed.sql"
      - "supabase/tests/**"
      - ".github/workflows/supabase.yml"

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Rebuild database from migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Apply all migrations from scratch
        run: supabase db reset --local

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Show migration status
        if: always()
        run: supabase migration list --local
